# Nginx site for the showroom system (filled in by deploy/install.sh).
server {
    listen 80;
    server_name __DOMAIN__;
    root __ROOT__;
    index index.php;

    client_max_body_size 20M;   # vehicle photos and Excel imports

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # The PWA service worker: never cached, so updates reach every device at once.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Built assets are fingerprinted: cache them for a long time.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 300;   # large reports and on-demand backups
    }

    location ~ /\.(?!well-known) { deny all; }
}
